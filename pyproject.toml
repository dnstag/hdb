[project]
name = "hdb"
version = "0.1.0"
description = "Ham Radio Discord Bot"
readme = "README.md"
authors = [
    { name = "yseibert", email = "yannick.seibert@gemtex.de" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[project.scripts]
hdb = "hdb:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]